<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kyle's Days at Ramp</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f9f9f9;
            color: #111;
        }

        .container {
            text-align: center;
        }

        .profile-pic {
            width: 120px; 
            height: 120px; 
            border-radius: 50%;
            background-color: #8d57f6;
            margin: 0 auto 20px auto;
            display: block;
            object-fit: cover;
        }

        .header {
            font-size: 2.5rem;
            font-weight: bold;
        }

        .highlight {
            background-color: #8d57f6;
            color: #fff;
            padding: 0.2rem 0.5rem;
            font-weight: bold;
            font-size: 2.5rem;
            border-radius: 4px;
        }

        .decimal-text {
            margin-top: 10px;
            font-size: 1rem;
            color: #555;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Profile Image -->
        <img src="profile.webp" alt="Profile Picture" class="profile-pic">
        
        <!-- Header -->
        <div class="header">
            Kyle's Days at Ramp <span class="highlight" id="number">0</span>
        </div>

        <!-- Decimal Counter -->
        <div class="decimal-text" id="decimals">0.000000</div>
    </div>

    <script>
        const startDate = new Date("2025-03-03T00:00:00"); // Ramp hire date

        function calculateDays() {
            const now = new Date();
            const diff = now - startDate;
            const days = diff / (1000 * 3600 * 24);

            document.getElementById("number").textContent = Math.floor(days);
            document.getElementById("decimals").textContent = days.toFixed(6);

            document.title = `Day ${Math.floor(days)} | Kyle's Days at Ramp`;
        }

        setInterval(calculateDays, 1000);
        calculateDays();
    </script>
</body>
</html>
